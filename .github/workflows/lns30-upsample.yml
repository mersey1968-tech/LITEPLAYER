name: LNS30 PCM upsampler and shaper Windows test
on:
  push:
    branches: [lns30-foobar-prototype]
    paths:
      - 'lns30/**'
      - '.github/workflows/lns30-upsample.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile x64 research test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cl.exe /nologo /std:c++17 /O2 /EHsc /W4 lns30/upsampler_test.cpp /Fe:dist/LNS30-Upsampler-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute numerical smoke tests
        shell: pwsh
        run: |
          & .\dist\LNS30-Upsampler-test.exe | Tee-Object -FilePath dist/results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LNS30-Upsampler-PCM-Windows-test
          path: dist/
