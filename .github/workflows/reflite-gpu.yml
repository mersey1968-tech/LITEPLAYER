name: SwinIR x3 export verification
on:
  push:
    branches: [reflite-swinir-feasibility]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch upstream model and source
        run: |
          git clone --depth 1 https://github.com/JingyunLiang/SwinIR.git upstream
          curl -fL --retry 3 https://github.com/JingyunLiang/SwinIR/releases/download/v0.0/002_lightweightSR_DIV2K_s64w8_SwinIR-S_x3.pth -o model.pth
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install timm==0.9.16 onnx==1.17.0 onnxruntime==1.21.0 numpy
      - name: Export official x3 network and verify numerical equivalence
        run: |
          mkdir -p dist
          PYTHONPATH=upstream python - <<'PY'
          import torch, numpy as np, onnxruntime as ort, onnx
          from models.network_swinir import SwinIR
          model=SwinIR(upscale=3,in_chans=3,img_size=64,window_size=8,img_range=1.,depths=[6,6,6,6],embed_dim=60,num_heads=[6,6,6,6],mlp_ratio=2,upsampler='pixelshuffledirect',resi_connection='1conv')
          model.load_state_dict(torch.load('model.pth',map_location='cpu',weights_only=True)['params'],strict=True)
          model.eval()
          print('Parameters:',sum(p.numel() for p in model.parameters()))
          torch.manual_seed(1)
          x=torch.rand(1,3,64,64)
          with torch.no_grad():
              expected=model(x).numpy()
              torch.onnx.export(model,x,'dist/swinir-x3-64.onnx',input_names=['rgb'],output_names=['output'],opset_version=17)
          onnx.checker.check_model('dist/swinir-x3-64.onnx')
          sess=ort.InferenceSession('dist/swinir-x3-64.onnx',providers=['CPUExecutionProvider'])
          y=sess.run(None,{'rgb':x.numpy()})[0]
          assert y.shape==(1,3,192,192)
          np.testing.assert_allclose(y,expected,rtol=0.001,atol=0.0002)
          print('Verified max error:',np.max(np.abs(y-expected)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SwinIR-x3-verified-ONNX
          path: dist/
