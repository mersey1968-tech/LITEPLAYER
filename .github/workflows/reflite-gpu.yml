name: Reflite 720p Detail Sync
on:
  push:
    branches: [reflite-v2-720p-detail-sync]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack stable Android project
        run: unzip -q LitePlayer.zip -d proj
      - name: Overlay original stable player implementation
        run: |
          cp source-review/app/src/main/java/com/example/liteplayer/MainActivity.kt proj/app/src/main/java/com/example/liteplayer/MainActivity.kt
          cp source-review/app/src/main/java/com/example/liteplayer/audio/IecAudioOutput.kt proj/app/src/main/java/com/example/liteplayer/audio/IecAudioOutput.kt
          cp source-review/app/src/main/java/com/example/liteplayer/SmbAccess.kt proj/app/src/main/java/com/example/liteplayer/SmbAccess.kt
          cp source-review/app/src/main/res/layout/activity_main.xml proj/app/src/main/res/layout/activity_main.xml
          sed -i '/^dependencies {/a\    implementation("eu.agno3.jcifs:jcifs-ng:2.1.10")' proj/app/build.gradle.kts
      - name: Isolate Reflite identity and stage research shader
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          g=Path("proj/app/build.gradle.kts")
          s=g.read_text()
          s,n=re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.example.reflite.experimental"', s, count=1)
          if n!=1: raise RuntimeError("Could not assign independent Reflite app ID")
          g.write_text(s)
          m=Path("proj/app/src/main/AndroidManifest.xml")
          x=m.read_text()
          x,n=re.subn(r'android:label\s*=\s*"[^"]+"', 'android:label="Reflite"', x, count=1)
          if n!=1: raise RuntimeError("Could not assign Reflite launcher label")
          m.write_text(x)
          shader=Path("proj/app/src/main/assets/reflite")
          shader.mkdir(parents=True,exist_ok=True)
          (shader/"low_ringing_6tap.frag").write_bytes(Path("research/referencescaler/low_ringing_6tap.frag").read_bytes())
          assert "com.example.reflite.experimental" in g.read_text()
          assert 'android:label="Reflite"' in m.read_text()
          print("Reflite app ID, launcher label, research shader staged")
          PY
      - name: Add opt-in GPU renderer in isolated test copy
        run: python3 research/referencescaler/patch_gpu.py
      - name: Install FSRCNNX trained neural inference and shader
        run: |
          mkdir -p proj/app/src/main/assets/reflite
          cp research/fsrcnnx/FSRCNNX_x2_8-0-4-1.glsl proj/app/src/main/assets/reflite/
          cp research/fsrcnnx/FSRCNNX_x2_16-0-4-1.glsl proj/app/src/main/assets/reflite/
          cp research/fsrcnnx/FsrcnnxPipeline.kt proj/app/src/main/java/com/example/liteplayer/
          test -s proj/app/src/main/assets/reflite/FSRCNNX_x2_8-0-4-1.glsl
          grep -q 'FsrcnnxPipeline' proj/app/src/main/java/com/example/liteplayer/ReferenceScalerView.kt
      - name: Give GPU test its own app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path("proj/app/build.gradle.kts")
          text=g.read_text()
          assert 'com.example.reflite.experimental' in text
          g.write_text(text.replace('com.example.reflite.experimental','com.example.reflite.gputest'))
          m=Path("proj/app/src/main/AndroidManifest.xml")
          text=m.read_text()
          assert 'android:label="Reflite"' in text
          m.write_text(text.replace('android:label="Reflite"','android:label="Reflite"'))
          PY
      - name: Apply stable neural SDR, subtitle overlay and persistent setting fixes
        run: python3 research/referencescaler/patch_sdr_clean.py
      - name: Render subtitles above neural surface
        run: python3 research/referencescaler/patch_subtitles_overlay.py
      - name: Stage natural-detail neural reconstruction
        run: python3 research/fsrcnnx/patch_natural_detail.py
      - name: Stage automatic gentle TV episode cleanup without additional settings
        run: python3 research/fsrcnnx/patch_auto_tv_cleanup.py
      - name: Protect neural input detail and reconstruct 720p to 4K
        run: python3 research/fsrcnnx/patch_720p_1080p_quality.py
      - name: Gentle local midtone contrast for depth without extra settings
        run: python3 research/fsrcnnx/patch_tv_microcontrast.py
      - name: Fix Back navigation when playback controls visible
        run: python3 research/referencescaler/patch_back_controls.py
      - name: Fix 1080p presentation and stop playback on exit; increase real neural detail
        run: python3 research/fsrcnnx/patch_playback_and_real_detail.py
      - name: Enable more capable FSRCNNX 16-channel trained model for 540p and 720p
        run: python3 research/fsrcnnx/patch_v2_16channel.py
      - name: Prime neural shaders and refine 720p detail and microcontrast
        run: python3 research/fsrcnnx/patch_v2_warmup_detail.py
      - name: Improve local black depth without clipping shadows
        run: python3 research/fsrcnnx/patch_v2_richer_blacks.py
      - name: Enhance 720p learned texture and image depth without added GPU texture reads
        run: python3 research/fsrcnnx/patch_v2_picture_depth_720.py
      - name: Correct 25 fps frame rate matching to 50 Hz without modifying picture quality
        run: python3 research/referencescaler/patch_afr_25_to_50.py
      - name: Reuse RGBA16F neural framebuffer targets after dependency last-use
        run: python3 research/fsrcnnx/patch_dependency_buffer_reuse.py
      - name: Synchronize 1080p neural surface readiness without changing 720p or audio sinks
        run: python3 research/fsrcnnx/patch_1080_startup_surface_sync.py
      - name: Apply precision sync and preserve neural texture filtering
        run: python3 research/fsrcnnx/patch_precision_sync.py
      - name: One-time backward seek after neural activation; retain contrast
        run: python3 research/fsrcnnx/patch_completed_frame_contrast.py
      - name: Cache shader locations and reduce redundant viewport updates
        run: python3 research/fsrcnnx/patch_gl_cache.py
      - name: Reuse duplicate neural inference and cache scalar uniform values
        run: python3 research/fsrcnnx/patch_reuse_draw.py
      - name: Remove unused renderer code and redundant frame work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("proj/app/src/main/java/com/example/liteplayer")
          def once(s,a,b):
              assert s.count(a)==1,(a,s.count(a))
              return s.replace(a,b,1)
          p=root/"ReferenceScalerView.kt"
          s=p.read_text()
          # No legacy scaler methods are called by the final SDR renderer.
          start=s.index("    private fun ensureFramebuffer(")
          end=s.index("    private fun fail(",start)
          s=s[:start]+s[end:]
          start=s.index("    companion object {")
          s=s[:start]+"}\n"
          for a in ["    private var texIntermediate = 0\n","    private var framebuffer = 0\n","    private var allocatedW = 0\n","    private var allocatedH = 0\n"]:
              s=once(s,a,"")
          s=once(s,"    private val vertices = ByteBuffer.allocateDirect(32).order(ByteOrder.nativeOrder()).asFloatBuffer()\n        .apply { put(floatArrayOf(-1f,-1f, 1f,-1f, -1f,1f, 1f,1f)); position(0) }\n","")
          s=once(s,"            if (texIntermediate!=0) GLES30.glDeleteTextures(1,intArrayOf(texIntermediate),0)\n            if (framebuffer!=0) GLES30.glDeleteFramebuffers(1,intArrayOf(framebuffer),0)\n            texIntermediate=0\n            framebuffer=0\n","")
          s=s.replace("import java.nio.ByteBuffer\n","").replace("import java.nio.ByteOrder\n","")
          s=once(s,"        diagnosticEnabled = enabled\n        requestRender()","        if (diagnosticEnabled == enabled) return\n        diagnosticEnabled = enabled\n        requestRender()")
          s=once(s,"        queueEvent { srcW = w; srcH = h; surfaceTexture?.setDefaultBufferSize(w,h); allocatedW = 0 }","        queueEvent {\n            if (srcW != w || srcH != h) {\n                srcW = w; srcH = h\n                surfaceTexture?.setDefaultBufferSize(w,h)\n            }\n        }")
          p.write_text(s)
          p=root/"FsrcnnxPipeline.kt"
          s=p.read_text()
          # Precompute exact producer indices; physical target IDs still come
          # from the existing dependency-aware allocation on every resize.
          anchor="    private val targets = mutableListOf<Target>()"
          s=once(s,anchor,anchor+"""
              private val inputProducers: List<IntArray> by lazy(LazyThreadSafetyMode.NONE) {
                  val producers = HashMap<String, Int>()
                  stages.mapIndexed { idx, stage ->
                      val inputs = IntArray(stage.inputs.size) { unit ->
                          val name = stage.inputs[unit]
                          if (name == "LUMA") -1 else producers[name]
                              ?: error("Missing network input " + name)
                      }
                      producers[stage.output] = idx
                      inputs
                  }
              }
          """)
          s=once(s,"        val named=mutableMapOf<String,Int>()","        val producers = inputProducers")
          s=once(s,'val texture=if(name=="LUMA")video else named[name]?:error("Missing network input "+name)','val producer = producers[idx][unit]\n                val texture=if(producer < 0) video else targets[producer].texture')
          s=once(s,"draw(stage.program);named[stage.output]=t.texture","draw(stage.program)")
          p.write_text(s)
          print("Clean pipeline staged; neural shaders, precision and adaptive timing unchanged")
          PY
      - name: Strengthen 720p detail and remove blocking periodic GPU timing at 720p
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("proj/app/src/main/java/com/example/liteplayer")
          def once(s,a,b):
              assert s.count(a)==1,(a,s.count(a))
              return s.replace(a,b,1)
          p=root/"FsrcnnxPipeline.kt"
          s=p.read_text()
          s=once(s,"float tvTextureStrength=1.0+0.21*", "float tvTextureStrength=1.0+0.85*")
          s=once(s,"textureGate,-.024,.024);","textureGate,-.032,.032);")
          # Keep the previous residual cap at 1080p.
          s=once(s,"textureGate,-.032,.032);","textureGate,-mix(.024,.032,1.0-smoothstep(770.0,910.0,uOriginalFrameHeight)),\n                    mix(.024,.032,1.0-smoothstep(770.0,910.0,uOriginalFrameHeight)));")
          s=once(s,"rgb=mix(rawRgb,weighted/total,0.22*detailProtection);","rgb=mix(rawRgb,weighted/total,mix(0.22,0.08,1.0-smoothstep(770.0,910.0,uOriginalFrameHeight))*detailProtection);")
          p.write_text(s)
          p=root/"ReferenceScalerView.kt"
          s=p.read_text()
          s=once(s,"            val sampleGpu = newFrame && (++presentedFrames % 8 == 0)","            val sampleGpu = srcH > 800 && newFrame && (++presentedFrames % 8 == 0)")
          # Keep full 720p neural resolution; preserve 1080p fallback and
          # its existing startup synchronization until separately tested.
          s=once(s,"            val workW = (srcW * neuralScale).toInt().coerceAtLeast(1)\n            val workH = (srcH * neuralScale).toInt().coerceAtLeast(1)","            val scale = if (srcH <= 800) 1.0f else neuralScale\n            val workW = (srcW * scale).toInt().coerceAtLeast(1)\n            val workH = (srcH * scale).toInt().coerceAtLeast(1)")
          p.write_text(s)
          print("720p detail and full-resolution GPU test staged")
          PY
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Reflite APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Preserve distinct APK filename
        run: |
          mkdir -p dist
          cp proj/app/build/outputs/apk/debug/app-debug.apk dist/Reflite-720p-DetailSync.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Reflite-720p-DetailSync-APK
          path: dist/Reflite-720p-DetailSync.apk
