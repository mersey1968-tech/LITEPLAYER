name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip LitePlayer.zip -d proj
      - name: Inspect network buffering source
        run: |
          echo '=== files ==='
          find proj/app/src/main -type f
          echo '=== buffering references ==='
          grep -RniE 'buffer|cache|readAhead|read_ahead|smb|readChunk|readSize' proj/app/src/main/java | head -120 || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: LitePlayer-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
