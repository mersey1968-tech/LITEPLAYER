name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: unzip LitePlayer.zip -d proj
      - name: Overlay reviewed optimization into build copy
        run: cp source-review/app/src/main/java/com/example/liteplayer/MainActivity.kt proj/app/src/main/java/com/example/liteplayer/MainActivity.kt
      - name: Overlay DTS-HD sync correction into build copy
        run: cp source-review/app/src/main/java/com/example/liteplayer/audio/IecAudioOutput.kt proj/app/src/main/java/com/example/liteplayer/audio/IecAudioOutput.kt
      - name: Overlay seek indicator layout
        run: cp source-review/app/src/main/res/layout/activity_main.xml proj/app/src/main/res/layout/activity_main.xml
      - name: Overlay native SMB streaming source
        run: cp source-review/app/src/main/java/com/example/liteplayer/SmbAccess.kt proj/app/src/main/java/com/example/liteplayer/SmbAccess.kt
      - name: Add SMB client library to build
        run: sed -i '/^dependencies {/a\    implementation("eu.agno3.jcifs:jcifs-ng:2.1.10")' proj/app/build.gradle.kts
      - name: Configure isolated release-candidate identity and test signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("proj/app/build.gradle.kts")
          t = p.read_text()
          assert 'applicationId = "com.example.liteplayer"' in t
          assert 'isMinifyEnabled = true' in t and 'isShrinkResources = true' in t
          t = t.replace('applicationId = "com.example.liteplayer"', 'applicationId = "com.example.liteplayer.rc"')
          t = t.replace('isMinifyEnabled = true', 'isMinifyEnabled = true\n            signingConfig = signingConfigs.getByName("debug")', 1)
          t = t.replace('proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))', 'proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")')
          p.write_text(t)
          # SLF4J 1.7 allows operation without the optional logging binding.
          Path("proj/app/proguard-rules.pro").write_text("-dontwarn org.slf4j.impl.StaticLoggerBinder\n-keep class jcifs.** { *; }\n-keep class org.bouncycastle.** { *; }\n-keep class org.slf4j.** { *; }\n")
          m = Path("proj/app/src/main/AndroidManifest.xml")
          mt = m.read_text().replace('android:label="LitePlayer"', 'android:label="LitePlayer RC"')
          m.write_text(mt)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build R8-optimized release candidate
        run: gradle assembleRelease
        working-directory: proj
      - name: Verify APK signature, ZIP alignment, and file sizes
        run: |
          APK=proj/app/build/outputs/apk/release/app-release.apk
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          ls -lh "$APK"
          echo "Release-candidate signed with temporary Android debug key; NOT a distributable production signing identity."
      - uses: actions/upload-artifact@v4
        with:
          name: LitePlayer-optimized-RC-not-public
          path: proj/app/build/outputs/apk/release/app-release.apk
