name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract source review (isolated branch only)
        if: github.ref == 'refs/heads/liteplayer-safe-optimization'
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          target=pathlib.Path('source-review')
          allowed={'.kt','.java','.kts','.gradle','.xml','.properties','.md','.txt','.json','.pro'}
          with zipfile.ZipFile('LitePlayer.zip') as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  if entry.is_dir() or p.is_absolute() or '..' in p.parts or any(x.startswith('.') for x in p.parts) or p.suffix.lower() not in allowed or entry.file_size>300000 or any(x in p.parts for x in ('build','.gradle','.idea')): continue
                  data=z.read(entry)
                  try: data.decode('utf-8')
                  except UnicodeDecodeError: continue
                  out=target.joinpath(*p.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
                  print(out)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-review
          if ! git diff --cached --quiet; then
            git commit -m 'Extract source for safe LitePlayer optimization review'
            git push
          fi
      - run: unzip LitePlayer.zip -d proj
      - name: Overlay reviewed optimization into build copy
        run: cp source-review/app/src/main/java/com/example/liteplayer/MainActivity.kt proj/app/src/main/java/com/example/liteplayer/MainActivity.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: LitePlayer-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
