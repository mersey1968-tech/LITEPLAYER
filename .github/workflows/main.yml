name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: unzip LitePlayer.zip -d proj
      - name: Overlay reviewed optimization into build copy
        run: cp source-review/app/src/main/java/com/example/liteplayer/MainActivity.kt proj/app/src/main/java/com/example/liteplayer/MainActivity.kt
      - name: Overlay DTS-HD sync correction into build copy
        run: cp source-review/app/src/main/java/com/example/liteplayer/audio/IecAudioOutput.kt proj/app/src/main/java/com/example/liteplayer/audio/IecAudioOutput.kt
      - name: Overlay seek indicator layout
        run: cp source-review/app/src/main/res/layout/activity_main.xml proj/app/src/main/res/layout/activity_main.xml
      - name: Overlay native SMB streaming source
        run: cp source-review/app/src/main/java/com/example/liteplayer/SmbAccess.kt proj/app/src/main/java/com/example/liteplayer/SmbAccess.kt
      - name: Add SMB client library to build
        run: sed -i '/^dependencies {/a\    implementation("eu.agno3.jcifs:jcifs-ng:2.1.10")' proj/app/build.gradle.kts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: LitePlayer-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
