name: LNS30 Windows test build
on:
  push:
    branches: [lns30-windows-test]
  workflow_dispatch:
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile native Windows x64 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & cl.exe /nologo /std:c++17 /O2 /EHsc /W4 /Fe:dist\\LNS30-test.exe lns30\\test.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run self-test
        shell: pwsh
        run: |
          .\dist\LNS30-test.exe | Tee-Object -FilePath dist/test-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LNS30-Windows-test-exe
          path: dist/
